name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cartão de estatísticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: SarahCha10
        run: |
          set -euo pipefail
          DADOS=$(gh api "users/$USUARIO")
          SEGUIDORES=$(echo "$DADOS" | jq '.followers')
          PUBLICOS=$(echo "$DADOS" | jq '.public_repos')
          REPOS=$(gh api --paginate "users/$USUARIO/repos?per_page=100" | jq -s 'add // []')
          ESTRELAS=$(echo "$REPOS" | jq '[.[].stargazers_count] | add // 0')
          ATUALIZADO=$(date -u +"%d/%m/%Y")

          cat > assets/stats.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" role="img" aria-label="Estatísticas do GitHub">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFF8FC"/>
                <stop offset="1" stop-color="#F3E8FF"/>
              </linearGradient>
            </defs>
            <rect width="820" height="170" rx="18" fill="url(#g)" stroke="#C8A2E8" stroke-width="2"/>
            <text x="30" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#7B4FD6">Estatísticas do GitHub</text>
            <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
              <text x="130" y="110" font-size="40" font-weight="700" fill="#4A3B6B">$PUBLICOS</text>
              <text x="130" y="140" font-size="15" fill="#7B4FD6">repositórios públicos</text>
              <text x="410" y="110" font-size="40" font-weight="700" fill="#4A3B6B">$SEGUIDORES</text>
              <text x="410" y="140" font-size="15" fill="#7B4FD6">seguidores</text>
              <text x="690" y="110" font-size="40" font-weight="700" fill="#4A3B6B">$ESTRELAS</text>
              <text x="690" y="140" font-size="15" fill="#7B4FD6">estrelas recebidas</text>
            </g>
            <text x="790" y="46" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#A78BFA">atualizado em $ATUALIZADO</text>
          </svg>
          SVG

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza estatísticas do GitHub"
            git push
          fi
