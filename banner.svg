<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Banner de Sarah Chalom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8A5C2"/>
      <stop offset="0.5" stop-color="#C8A2E8"/>
      <stop offset="1" stop-color="#7B4FD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- Formas decorativas -->
  <circle cx="1100" cy="60" r="120" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="1200" cy="260" r="80" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="60" cy="300" r="140" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Circuito tecnológico -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2">
    <path d="M760 40 H900 V110 H1040 V90 H1120"/>
    <path d="M700 280 H820 V220 H960 V250 H1180"/>
    <path d="M1000 170 H1080 V140"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.8">
    <circle cx="760" cy="40" r="5"/>
    <circle cx="900" cy="110" r="5"/>
    <circle cx="1040" cy="110" r="5"/>
    <circle cx="1120" cy="90" r="5"/>
    <circle cx="700" cy="280" r="5"/>
    <circle cx="960" cy="220" r="5"/>
    <circle cx="1180" cy="250" r="5"/>
  </g>

  <!-- Textos -->
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Sarah Chalom</text>
  <text x="84" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity="0.95">Estudante de Ciência da Computação · Mackenzie</text>
  <text x="84" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="3">PYTHON · JAVA · C · SQL · SWIFT · FIGMA</text>
</svg>
